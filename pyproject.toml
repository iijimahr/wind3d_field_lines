[build-system]
requires = [
  "meson-python",
  "meson>=1.5",
  "ninja>=1.11",
  "numpy>=2.0",
]
build-backend = "mesonpy"

[project]
name = "wind3d-field-lines"
version = "0.2.0"
description = "Magnetic field line tracer for wind3d data"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["numpy>=2.0", "matplotlib>=3.8"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.10"]
docs = ["sphinx>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"
fix = false

[tool.ruff.lint]
select = [
  "E",  # pycodestyle error
  "F",  # pyflakes
  "I",  # isort
  "B",  # flake8-bugbear
  "UP", # pyupgrade
]
ignore = [
  "E203", # Black compatibility
]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
ignore_missing_imports = true
files = ["src"]
