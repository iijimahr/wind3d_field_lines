name: CI

on:
  pull_request:
    branches: [main]
  push:

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Fortran compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install meson-python meson ninja
          python -m pip install -e ".[dev,docs]" --no-build-isolation

      - name: Build wheel
        run: python -m pip wheel . --no-deps -w dist

      - name: Lint (ruff)
        run: ruff check . --no-fix

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Type check (mypy)
        run: python -m mypy src

  test-docs:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
        install-mode: ["editable", "non-editable"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Fortran compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install package (editable)
        if: matrix.install-mode == 'editable'
        run: |
          python -m pip install meson-python meson ninja
          python -m pip install -e ".[dev,docs]" --no-build-isolation

      - name: Install package (non-editable)
        if: matrix.install-mode == 'non-editable'
        run: python -m pip install ".[dev,docs]"

      - name: Unit tests
        run: pytest -q

      - name: Doctest
        run: sphinx-build -b doctest docs/source docs/build/doctest

      - name: Build docs
        run: sphinx-build -b html docs/source docs/build/html
